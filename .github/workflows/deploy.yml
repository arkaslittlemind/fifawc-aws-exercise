name: Deploy to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: arka-fifa-world-cup-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E30UALMLUH9M4S
  LAMBDA_FUNCTION_NAME: fifa-world-cup-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # -------------------------
      # Frontend
      # -------------------------

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy frontend to S3
        run: |
          aws s3 sync client/dist s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # -------------------------
      # Backend
      # -------------------------

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Build backend
        working-directory: server
        run: npm run build

      - name: Prepare Lambda package
        working-directory: server
        run: |
          rm -rf lambda-package
          mkdir lambda-package

          cp dist/lambda.js lambda-package/
          cp -r dist/data lambda-package/

      - name: Create Lambda ZIP
        working-directory: server
        run: |
          cd lambda-package
          zip -r ../lambda.zip .

      - name: Deploy Lambda
        working-directory: server
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://lambda.zip